services:

  mysql:
    image: mysql:8.4
    container_name: fitai-mysql
    restart: unless-stopped
    command:
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitai_trainer}
      MYSQL_USER: ${MYSQL_USER:-fitai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fitai_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fitai-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: fitai-ai-service:latest
    container_name: fitai-ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - EXERCISE_YOLO_MODEL=/app/models/best.pt
      - EXERCISE_YOLO_CONF=0.45
      - EXERCISE_YOLO_IMGSZ=640
    volumes:
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fitai-backend:latest
    container_name: fitai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - IS_DOCKER=true
      - DATABASE_URL=mysql://${MYSQL_USER:-fitai}:${MYSQL_PASSWORD:-fitai_password}@mysql:3306/${MYSQL_DATABASE:-fitai_trainer}
      - JWT_SECRET=${JWT_SECRET:-fitai_trainer_production_secret_key_change_me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AI_SERVICE_URL=http://ai-service:8000
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80,http://127.0.0.1}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-FitAI Trainer <rphiphathnl@gmail.com>}
      - SMTP_SERVICE=${SMTP_SERVICE:-gmail}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-rphiphathnl@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-knaccxknvcsnweyd}
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fitai-frontend:latest
    container_name: fitai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
